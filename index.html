async function api(path,opt={}){const r=await fetch(API+path,{credentials:'same-origin',...opt,headers:{...(opt.headers||{})}});const text=await r.text();let j=null;try{j=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(j?.error||text||`Request failed ${r.status}`);return j||{ok:true}}
async function command(op,payload={},retry=true){payload={...payload,operator_role:operatorRole};const body={op,payload,expected_rev:state?.rev};

function syncRoleBtn(){const b=document.getElementById('roleBtn');if(b)b.textContent=operatorRole.toUpperCase()}function openRole(){modal('Who is using LUXX?',`<div class="banner">Both roles have identical powers. The label is recorded only so LUXX knows who completed an action.</div><div class="form"><label>Current operator</label><select id="operatorRole">${OPERATOR_ROLES.map(r=>`<option ${operatorRole===r?'selected':''}>${esc(r)}</option>`).join('')}</select><div class="actions"><button class="primary" onclick="saveRole()">USE THIS ROLE</button></div></div>`)}function detectTz(){try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone;const sel=document.getElementById('tzSel');if(!sel)return;if(![...sel.options].some(o=>o.value===z))sel.add(new Option(z,z));sel.value=z}catch{alert('Could not detect a timezone on this device.')}}

// SINGLE source of truth for reading the Library. Everything that refreshes assets must call
// this. A previous build paginated /assets but left the 4s poll fetching only the first page
// and assigning it over the whole in-memory list, which silently truncated the Library to 120.
let libSignature=null;
async function fetchAllAssets(){
  let out=[],cursor=0,guard=0,total=null;
  while(guard++<60){
    const a=await api(`/assets?limit=120&cursor=${cursor}`);
    total=a.total;
    out=out.concat(a.assets||[]);
    if(a.next_cursor==null||!(a.assets||[]).length)break;
    cursor=a.next_cursor;
  }
  // The server pages in a stable key order; display order is the client's job.
  out.sort((x,y)=>new Date(y.uploaded_at||0)-new Date(x.uploaded_at||0));
  // Hard invariant: what we hold must equal what the server has. If it does not, an asset
  // vanished without a delete, which is the exact v1.4.7 failure. Surface it, never hide it.
  if(total!=null&&out.length!==total)console.error(`LUXX LIBRARY MISMATCH: holding ${out.length}, server has ${total}`);
  return out;
}


let consentSynced=false;
async function syncLibraryConsent(){
  if(consentSynced)return; consentSynced=true;
  const stale=(assets||[]).filter(a=>a.authorization_status!=='AUTHORIZED'
    &&a.availability!=='QUARANTINED'&&a.status!=='PROCESSING_FAILED');
  if(!stale.length)return;
  try{
    for(let i=0;i<stale.length;i+=150)
      await api('/asset-batch-update',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({asset_ids:stale.slice(i,i+150).map(a=>a.asset_id),
          authorization_status:'AUTHORIZED',availability:'AVAILABLE'})});
    assets=await fetchAllAssets();
    if(view==='library')render();
  }catch{consentSynced=false;}
}


async function ensureScansForToday(){
  const need=(assets||[]).filter(a=>a.media_type==='IMAGE'
    && a.authorization_status==='AUTHORIZED' && a.availability!=='QUARANTINED'
    && !(a.variants||[]).some(v=>v.privacy_safe_export===true));
  if(!need.length)return 0;
  // Enough to fill the day, not the whole library. The background sweep still handles
  // the rest; this is only so TODAY has something to attach right now.
  const batch=need.slice(0,12);
  let done=0;
  for(let i=0;i<batch.length;i+=4){
    await Promise.all(batch.slice(i,i+4).map(a=>
      api('/privacy-audit',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({asset_id:a.asset_id})}).then(()=>{done++}).catch(()=>{})));
  }
  if(done)assets=await fetchAllAssets();
  return done;
}

async function refreshToday(){
  try{

    const needFile=(state.tasks||[]).some(t=>t.date===new Date().toISOString().slice(0,10)&&t.needs_file!==false);
    if(needFile)await ensureScansForToday();
    let sheet=null;
    if((state.tasks||[]).length){
      const resp=await fetch('/config/LUXX001_HOLD_SHEET_28DAY.json',{cache:'no-store'});
      if(resp.ok)sheet=await resp.json();
    }
    const r=await api('/action',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({op:'TODAY_TASKS',payload:sheet?{sheet}:{}})});

async function runBackgroundRepairs(){for(const a of assets){const safe=(a.variants||[]).some(v=>v.privacy_safe_export===true&&v.metadata_stripped===true);if(a.media_type==='IMAGE'&&!safe&&['SCAN_REQUIRED','PRIVACY_SCAN_REQUIRED'].includes(a.privacy?.status||'SCAN_REQUIRED')&&!privacyStarted.has(a.asset_id)){privacyStarted.add(a.asset_id);fetch(API+'/privacy-audit',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({asset_id:a.asset_id})}).catch(()=>privacyStarted.delete(a.asset_id));}// A staged job stops on its time budget, saves progress, and reports CONTINUE. It must be

// Everything the job recorded about why it stopped, in the order it happened. A video
// that sits at PROCESSING has a reason stored against it; hiding that reason is what
// turned every stall into an archaeology exercise in the platform logs.
function jobDiagnosticHtml(a){
  const j=a.processing_job; if(!j)return esc(a.processing_error||'');
  const bits=[];
  if(j.stage)bits.push('Stage: '+esc(j.stage));
  if(j.note)bits.push(esc(j.note));
  if(j.trigger_error)bits.push('Could not start the renderer: '+esc(j.trigger_error));
  else if(j.trigger_http_status&&j.trigger_http_status>=400)bits.push('Renderer rejected the job (HTTP '+j.trigger_http_status+')');
  const err=j.error||a.processing_error;
  if(err)bits.push('Error: '+esc(String(err).slice(0,400)));
  if((j.completed_variants||[]).length)bits.push(j.completed_variants.length+' of the derivatives finished');
  if(j.stale)bits.push('No progress for '+Math.round((j.age_ms||0)/60000)+' minutes. LUXX will retry it.');
  else if(j.triggered_at)bits.push('Started '+esc(fmt(j.triggered_at)));
  else if(j.trigger_requested_at&&!j.triggered_at)bits.push('Asked the renderer to start but never heard back.');
  if(Number(j.trigger_attempts||0)>1)bits.push(j.trigger_attempts+' attempts so far');
  return bits.join('<br>');
}

function isBrokenUpload(a){
  if(a.media_type!=='VIDEO')return false;
  if(a.status==='PROCESSING_FAILED')return true;
  // A finished video has a privacy derivative and something to play. Judging that from
  // the asset itself catches an upload that died quietly; the old rule waited on a stale
  // flag the server only sets after three minutes, so a dead upload sat in the library
  // looking like it was still working.
  // A video that has just finished uploading has no job yet and no variants. That is the
  // start of its life, not the end of it — hiding it made a successful upload vanish.
  // A video that has a job is never hidden, whatever state that job is in. Hiding a
  // stalled one took the reason off the screen three minutes after upload: the video
  // appeared, then vanished, and the error it was carrying went with it. Only an upload
  // that failed outright, or one with no job at all and nothing to play, is dead.
  if(a.processing_job)return false;
  if(a.status==='PROCESSING_REQUIRED'||a.status==='PROCESSING')return false;
  const usable=(a.variants||[]).some(v=>v&&(v.privacy_safe_export===true||v.metadata_stripped===true));
  return !usable&&a.status!=='READY_FOR_REVIEW';
}
async function clearBrokenUploads(){
  const junk=(assets||[]).filter(isBrokenUpload);
  if(!junk.length)return alert('Nothing broken to clear.');
  if(!confirm(`Delete ${junk.length} upload${junk.length===1?'':'s'} that never finished processing? Nothing that posted or was measured is touched.`))return;
  let gone=0,kept=[];
  for(const a of junk){
    try{
      await api('/asset-delete',{method:'DELETE',headers:{'content-type':'application/json'},
        body:JSON.stringify({asset_id:a.asset_id})});
      gone++;
    }catch{kept.push(a.name||a.asset_id);}
  }
  assets=await fetchAllAssets();render();
  alert(gone+' removed.'+(kept.length?` ${kept.length} could not be deleted because they have history.`:''));
}

// An asset referenced by a historical publication, a prescription, an action or the audit
// ledger can never be erased. Offering DELETE DUPLICATE there was a control for an
// impossible action; the honest action is MARK UNAVAILABLE.
function historyReferences(a){
  const refs=[];
  if((state.historicalPublications||[]).some(h=>h.asset_id===a.asset_id))refs.push('historical publication');
  if((state.prescriptions||[]).some(p=>p.asset_id===a.asset_id))refs.push('prescription');
  if((state.actions||[]).some(x=>x.asset_id===a.asset_id))refs.push('recorded action');
  if(Number(a.use_count||0)>0||a.ever_used_prospectively)refs.push('posting history');
  return refs;
}
function historyProtectedHtml(a){
  const refs=historyReferences(a);
  if(!refs.length)return `<button class="danger" onclick="deleteUnusedAsset('${a.asset_id}')">DELETE DUPLICATE</button>`;
  return `<div class="banner"><strong>HISTORY-PROTECTED</strong> — referenced by ${esc(refs.join(', '))}. LUXX never erases anything with history. Marking it unavailable keeps the record and stops future TODAY use.</div>`
    +(a.availability==='UNAVAILABLE'
      ? `<div class="tiny">Already marked UNAVAILABLE. It will not be prescribed again.</div>`
      : `<button class="danger" onclick="markUnavailable('${a.asset_id}')">MARK UNAVAILABLE</button>`);
}

        const isVideo=f.type.startsWith('video/')||/\.(mov|mp4|m4v)$/i.test(f.name);
        const assetId=uid(isVideo?'VIDEO':'IMAGE'),parts=Math.ceil(f.size/CHUNK);
        // Retry the CHUNK, not the whole file. A 185 MB upload is ~53 chunks, and one
        // dropped connection used to discard every chunk that had already succeeded and
        // start again under a new asset id. Each chunk now gets its own retries with
        // backoff, so a brief network blip costs seconds instead of the entire upload.
        for(let i=0;i<parts;i++){
          const chunk=f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK));
          let sent=false,lastErr=null,wait=800;
          for(let c=1;c<=4&&!sent;c++){
            say(`${head}<br>uploading chunk ${i+1}/${parts}${c>1?` · retry ${c-1} of 3`:''}`
              +`<br>${done} saved · ${failed.length} failed · ${duplicates} duplicate`);
            try{
              await api('/upload-chunk',{method:'POST',headers:{'x-luxx-asset-id':assetId,'x-luxx-part':String(i),'x-luxx-total-parts':String(parts)},body:chunk});
              sent=true;
            }catch(ce){
              lastErr=ce;
              if(c<4){await new Promise(r=>setTimeout(r,wait));wait=Math.min(wait*2,6000);}
            }
          }
          if(!sent)throw new Error(`chunk ${i+1} of ${parts} failed after 4 attempts: ${lastErr&&lastErr.message||lastErr}`);
          if(i===parts-1)say(`${head}<br>finishing ${esc(f.name)}…`);
        }
        await makeThumb(f,assetId);
        const res=await api('/upload-complete',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({asset_id:assetId,batch_id:batchId,name:f.name,type:f.type||'application/octet-stream',size:f.size,parts,media_type:isVideo?'VIDEO':'IMAGE',authorization_status:auth,historical_usage_status:hist,notes})});
        if(res.duplicate){duplicates++;saved=true;break}
        if(isVideo&&res.asset&&res.asset.job_id){
          say(`${head}<br>starting the renderer`);
          // The job blob may not be visible the instant it is written, so retry. And do
          // not swallow the outcome: a renderer that never starts is the difference
          // between a video that processes and one that sits at PROCESSING forever.
          let kicked=null,kickErr=null;
          for(let c=0,wait=250;c<3;c++){
            try{
              const kr=await api('/kick-media-job',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({job_id:res.asset.job_id})});
              kicked=kr;
              if(kr&&kr.started!==false)break;
              kickErr=(kr&&kr.trigger_error)||'The renderer did not start.';
            }catch(ke){kickErr=String((ke&&ke.message)||ke);}
            if(c<2){await new Promise(r=>setTimeout(r,wait));wait*=2;}
          }
          if(!kicked||kicked.started===false){
            failed.push({name:f.name,size:f.size,error:'Uploaded, but the renderer did not start: '+(kickErr||'unknown')});
            say(`${head}<br>uploaded, but the renderer did not start`);
          }
        }else if(!isVideo){
          say(`${head}<br>preparing safe version`);
          try{await api('/image-edit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({asset_id:assetId,auto_best:true,recipe:{aspect:'ORIGINAL'}})})}catch{}
        }
        done++;saved=true;break;
      }catch(e){
        if(attempt===2)failed.push({name:f.name,size:f.size,error:String(e&&e.message||e)});
      }
    }
    // Successful files are visible immediately, so a refresh never loses them.
    if(fi%10===9){try{await load();if(view==='library')render()}catch{}}
  }
  uploadFailures=failed;
  const summary=`Batch finished. ${done} saved · ${duplicates} exact duplicate${duplicates===1?'':'s'} skipped · ${failed.length} failed.`;
  await load();render();
  if(failed.length){
    say(`${esc(summary)}<br>${failed.map(x=>esc(x.name)+': '+esc(x.error)).join('<br>')}`);
    alert(summary+'\n\n'+failed.map(x=>x.name+':\n'+x.error).join('\n\n')
      +'\n\nEverything else is already saved, so only the failures need to be chosen again.');
  }else{
    say(esc(summary));
    closeModal();
  }
}

function playVideo(aid,vid){

  if(!wrap)return;
  const src='/api/hls?asset='+encodeURIComponent(aid)+'&variant='+encodeURIComponent(vid);
  wrap.innerHTML='<video id="vplayer" controls playsinline preload="metadata" style="width:100%;max-height:62vh;background:#000"></video>';
  const el=document.getElementById('vplayer');
  // Playback failure is reported, never hidden behind a black rectangle.
  el.addEventListener('error',()=>{
    const e=el.error;
    msg.textContent='Playback failed'+(e&&e.code?` (media error ${e.code})`:'')+'. This browser may not play this stream. Use DOWNLOAD MP4 to check the file itself.';
  });
  el.addEventListener('loadeddata',()=>{msg.textContent=''});
  if(el.canPlayType('application/vnd.apple.mpegurl')){el.src=src;}
  else{
    // No native HLS here. Stream the rendered MP4 chunks instead of showing nothing.
    msg.textContent='Preparing playback…';
    downloadManifestBlob(aid,vid).then(url=>{el.src=url;msg.textContent='';})
      .catch(err=>{msg.textContent='Playback failed: '+err.message+'. Use DOWNLOAD MP4 to check the file itself.';});
  }
  if(btn)btn.disabled=true;
  el.play&&el.play().catch(()=>{});
}
async function downloadManifestBlob(aid,vid){
  const m=await api(`/download-manifest?asset=${encodeURIComponent(aid)}&variant=${encodeURIComponent(vid||'')}`),parts=[];
  for(const p of m.parts){const r=await fetch(p.url,{credentials:'same-origin'});if(!r.ok)throw new Error('Playback chunk failed');parts.push(await r.blob())}
  const url=URL.createObjectURL(new Blob(parts,{type:m.type||'video/mp4'}));
  setTimeout(()=>URL.revokeObjectURL(url),300000);
  return url;
}

// Generalised concept match. v1.4.6 hardcoded a couch-versus-boat regex, which passed exactly

// against semantic tags when present, falling back to filename/notes/batch text when not.
function assetConceptText(a){return `${a.name||''} ${a.notes||''} ${a.batch_id||''} ${(a.commercial_role||[]).join(' ')} ${((a.semantic&&a.semantic.tags)||[]).join(' ')} ${(a.semantic&&a.semantic.setting)||''}`.toLowerCase()}
function branchConceptScore(s,a){
  const terms=branchTerms(s),hay=assetConceptText(a);
  const tags=((a.semantic&&a.semantic.tags)||[]).map(t=>String(t).toLowerCase());

  for(const t of terms){
    if(tags.includes(t)){tagHits++;hits++;continue}
    if(hay.includes(t))hits++;

  let score=tagHits*20+(hits-tagHits)*12;

function openHistoricalImport(){
  modal('Import historical publications','<div class="form">'
    +'<div class="banner">Paste rows exported from the creator dashboards. LUXX stores them as HISTORICAL and never deletes or rewrites them. It will <strong>suggest</strong> a matching master but will not link one without your confirmation.</div>'
    +'<label>Format</label><select id="hiFmt"><option value="json">JSON array</option><option value="csv">CSV with header row</option></select>'
    +'<label>Rows</label><textarea id="hiText" rows="10" placeholder=\'[{"platform":"Pornhub","title":"Lake House Afternoon","url":"https://...","published_at":"2025-11-14","runtime_seconds":451,"views":2140}]\'></textarea>'
    +'<div class="actions"><button class="primary" onclick="runHistoricalImport()">IMPORT</button></div>'
    +'<div id="hiOut" class="tiny"></div></div>');
}
async function runHistoricalImport(){
  const fmt=document.getElementById('hiFmt').value,txt=document.getElementById('hiText').value;
  let rows=[];
  try{
    if(fmt==='json'){rows=JSON.parse(txt);if(!Array.isArray(rows))throw new Error('JSON must be an array of rows.');}
    else{rows=await command('HIST_PARSE_CSV',{text:txt});}
  }catch(e){document.getElementById('hiOut').textContent='Could not read the rows: '+e.message;return}
  try{
    const r=await command('HIST_IMPORT',{rows:rows});
    let msg='Imported '+r.imported+' record'+(r.imported===1?'':'s')+'.';
    if(r.errors&&r.errors.length)msg+=' '+r.errors.length+' row(s) rejected: '+r.errors.map(function(e){return 'row '+e.row+' '+e.error}).join('; ');
    document.getElementById('hiOut').textContent=msg;
    await load();render();
  }catch(e){document.getElementById('hiOut').textContent=e.message}
}
async function suggestMatch(hid){

      return '<div class="row"><div><b>'+esc(c.name||c.asset_id)+'</b><div class="tiny">'+esc(c.why.join(' · '))+'</div></div>'
        +'<button class="primary" onclick="confirmMatch(\''+hid+'\',\''+c.asset_id+'\')">CONFIRM THIS</button></div>';
    }).join('')||'<div class="sub">No plausible master found. Upload the original file first.</div>';
    modal('Match to a LUXX master','<div class="banner"><strong>'+esc(r.confidence)+'</strong> — '+esc(r.note)+'</div>'+cands);
  }catch(e){alert(e.message)}
}

// One structured file, then a human review, then CAPTURE, then LOCK.
function baselineImportHtml(){
  const b=(state&&state.baseline)||{};

  const imported=snaps.filter(function(x){return x.source==='IMPORT'});
  const na=snaps.reduce(function(a,x){return a+((x.not_available||[]).length)},0);
  return '<h3>Import baseline</h3>'
    +'<div class="banner'+(b.locked?' dangerBanner':'')+'">'+(b.locked
      ? 'BASELINE IS LOCKED. Import cannot overwrite a locked baseline.'

    +'<div class="tiny">JSON: {"rows":[{"platform":"X","metric":"followers","value":36,"evidence_reference":"screenshot"}]}. CSV header: platform,metric,value,unit,evidence_reference,notes. A number you could not obtain is written NOT_AVAILABLE and stays NOT AVAILABLE — never zero. Old reference seeds are never promoted into the launch baseline.</div>'
    +'<label>Baseline file (.json or .csv)</label><input id="blImpFile" type="file" accept=".json,.csv,application/json,text/csv" '+(b.locked?'disabled':'')+'>'
    +'<label>Or paste the file contents</label><textarea id="blImpText" '+(b.locked?'disabled':'')+'></textarea>'
    +'<div class="actions"><button id="importBaselineBtn" class="secondary" '+(b.locked?'disabled':'')+' onclick="runBaselineImport()">IMPORT BASELINE</button></div>'
    +'<div id="blImpOut" class="tiny">'+(imported.length?('Imported '+imported.length+' platform(s) pending review · '+na+' value(s) recorded NOT AVAILABLE.'):'')+'</div>'
    +(snaps.length?('<div class="tiny">'+snaps.map(function(x){
        const m=Object.keys(x.metrics||{}).map(function(k){return k+'='+x.metrics[k]}).join(', ');
        const nas=(x.not_available||[]).length?(' · NOT AVAILABLE: '+x.not_available.join(', ')):'';
        return '<div class="kv"><b>'+esc(x.platform)+'</b><div>'+esc(m||'no numeric values')+esc(nas)+' · '+esc(x.review_state||'ENTERED')+'</div></div>';
      }).join('')+'</div>'):'');
}
async function runBaselineImport(){
  const f=document.getElementById('blImpFile'),t=document.getElementById('blImpText');
  let text=(t&&t.value||'').trim();
  // Anything already typed into the baseline fields must survive the refresh below.
  const held=setupDraft();
  try{
    if(!text&&f&&f.files&&f.files[0])text=await f.files[0].text();
    if(!text){alert('Choose a baseline file or paste its contents.');return}
    const r=await command('BASELINE_IMPORT',{text:text});
    closeModal();await load();openSetup();restoreSetupDraft(held);
    const out=document.getElementById('blImpOut');
    if(out)out.textContent='Imported '+r.imported+' row(s) across '+r.platforms.join(', ')+'. '+r.next_step+' Nothing was locked.';
  }catch(e){alert(e.message)}
}
// The operator's in-progress SETUP typing, carried across a modal refresh.
function setupDraft(){
  const g=i=>{const el=document.getElementById(i);return el?el.value:null};
  return {be:g('be'),bi:g('bi'),bn:g('bn')};
}
function restoreSetupDraft(d){
  if(!d)return;
  for(const k of ['be','bi','bn']){
    const el=document.getElementById(k);
    if(el&&d[k]!=null&&d[k]!==''&&!el.value)el.value=d[k];
  }
}

// The 28-day plan is a config document, not code. It is loaded once, deliberately, by
// the producer. Import is idempotent: running it twice does not duplicate the month.
async function loadHoldSheet(){
  if(!confirm('Load the 28-day plan into TODAY? Days already loaded are skipped.'))return;
  try{
    const sheet=await (await fetch('/config/LUXX001_HOLD_SHEET_28DAY.json',{cache:'no-store'})).json();
    const r=await api('/action',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({op:'HOLD_SHEET_IMPORT',payload:sheet})});
    const res=r&&r.result,made=Array.isArray(res)?res.length:0,fresh=(res&&res.refreshed)||0;
    await load();render();
    alert(made?`Loaded ${made} jobs across ${sheet.days.length} days.`
      :fresh?`Updated ${fresh} jobs with the current instructions. Nothing you already recorded was changed.`
      :'Already up to date.');
  }catch(e){alert('Could not load the plan: '+String(e&&e.message||e));}
}

function openSetup(){modal('Setup / readiness',`<div class="form">

rm)}</b><div class="tiny">${esc(a.seed)} · ${esc(a.role)}</div></div>${pill(a.status)}</div>`).join('')}<div class="actions"><button id="selfTestBtn" class="secondary" onclick="runHealth()">SYSTEM HEALTH</button><button class="secondary" onclick="logout()">LOG OUT</button></div></div>`)}async function captureBase(){
  const be=document.getElementById('be'),bi=document.getElementById('bi'),bn=document.getElementById('bn');

  try{await command('BASELINE_CAPTURE',{evidence_reference:ev,inventory_mapping_reference:inv,notes:(bn&&bn.value)||''});
    closeModal();await load();openSetup()}catch(e){alert(e.message)}}async function lockBase(){try{await command('BASELINE_LOCK');closeModal();await load();render()}catch(e){alert(e.message)}}async function runHealth(){try{const h=await api('/health');alert(`LUXX ${h.version}\nParent ${h.parent.name}\nStorage/API reachable.`)}catch(e){alert(e.message)}}async function logout(){await api('/logout');location.reload()}
function startPoll(){if(poll)return;poll=setInterval(async()=>{try{// One cheap listing call. No asset reads unless something actually changed.
    const idx=await api('/assets-index');
    if(idx.signature===libSignature&&idx.count===assets.length)return;
    libSignature=idx.signature;
    assets=await fetchAllAssets();
    try{recommendation=await command('RECOMMEND')}catch{}
    try{todayList=await command('TODAY_LIST',{limit:5})}catch{}
    try{todayPlan=await command('TODAY_PLAN',{})}catch{}
    render()}catch{}},4000)}
boot();
